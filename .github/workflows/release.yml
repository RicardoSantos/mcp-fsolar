name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Build & push multi-arch Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Strip v prefix from version
        id: version
        run: echo "name=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64 + arm/v7 + arm/v6)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/mcp-fsolar/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/mcp-fsolar:${{ steps.version.outputs.name }}
            ghcr.io/${{ steps.owner.outputs.name }}/mcp-fsolar:latest

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install via Home Assistant Add-on

            1. In HA: **Settings → Add-ons → Add-on Store → ⋮ → Repositories**
            2. Add `https://github.com/RicardoSantos/mcp-fsolar`
            3. Install **mcp-fsolar**, configure credentials, start

            ## Install dashboard cards (ha-fsolar)

            Add `https://github.com/RicardoSantos/ha-fsolar` as a HACS custom repository (Dashboard category).

            ## Docker image

            `ghcr.io/ricardosantos/mcp-fsolar:${{ github.ref_name }}` — multi-arch (amd64, arm64, arm/v7, arm/v6)
